# Reusable workflow: run the Claude Code agent swarm (docker/swarm.sh) of the CALLING repo inside that repo's
# own Dockerfile `full` stage, built with the Claude Code CLI.  Called by each DV repo's
# .github/workflows/swarm.yml (shipped by the kit):  uses: markrthomas/dv-swarm-kit/.github/workflows/swarm-run.yml@v0
#
# Needs, in the CALLING repo: secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`; preferred) or
# ANTHROPIC_API_KEY, passed with `secrets: inherit`.  The swarm pushes `swarm/<date>-<topic>` branches with the
# job's GITHUB_TOKEN; a human reviews and merges.  If dv-swarm-kit is private, enable
# Settings -> Actions -> General -> Access -> "Accessible from repositories owned by the user" on dv-swarm-kit.
name: swarm-run

on:
  workflow_call:
    inputs:
      task:
        description: "task file (repo-relative)"
        type: string
        default: "docker/swarm-task.md"
      model:
        description: "model for the manager agent (empty = CLI default)"
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 120
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

jobs:
  swarm:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: require a credential
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: test -n "$OAUTH$KEY" || { echo "::error::set the CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) repository secret"; exit 1; }
      - name: require the swarm kit
        run: |
          test -f .claude/swarm.env || { echo "::error::.claude/swarm.env missing - run dv-swarm-kit/sync.sh on this repo"; exit 1; }
          echo "swarm-kit $(cat .claude/swarm-kit.version 2>/dev/null || echo '?')"
      - name: build image (full stage, with Claude Code CLI)
        run: docker build --build-arg WITH_CLAUDE=1 --target full -t dv-swarm .
      - name: run swarm
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
          MODEL: ${{ inputs.model }}
        run: |
          docker run --rm -e CLAUDE_CODE_OAUTH_TOKEN -e ANTHROPIC_API_KEY -e GITHUB_TOKEN -v "$PWD:/repo" dv-swarm \
            swarm --task "$TASK" ${MODEL:+--model "$MODEL"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-metrics
          path: docker/last-run-metrics.json
          if-no-files-found: warn
